name: 'produce trash 🗑️'

on:
  # Run every hour on the hour
  schedule:
    - cron: '0 * * * *'
  # Allow manual triggering of the workflow
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v2  # Update to the latest stable version if 'master' is not the latest
        with:
          ref: trunk
          persist-credentials: false  # Use custom credentials for pushing
          fetch-depth: 0  # Fetch all history for all branches and tags

      # Set up Python environment
      - name: Set up Python 3.x
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      # Configure Git and make commits
      - name: Make trash commits
        run: |
          git config --local user.email "kasper.krawczyk@gmail.com"
          git config --local user.name "KasperKrawczyk"
          python make_commits.py

      # Push the commits
      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.TOKEN }}
          force: 'true'
          branch: 'trunk'
